<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
    <title>Memory Game</title>
    <style>
        body {
            padding: 0;
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        @font-face {
            font-family: 'GardenFlower';
            src: url(assets/fonts/GardenFlower.ttf);
            font-display: block;
            -moz-osx-font-smoothing: grayscale;
            -webkit-font-smoothing: always;
        }
        .fontPreload {
            font-family: 'GardenFlower';
            position: absolute;
            left: -100px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        canvas {
            display: block;
            margin: 0 auto;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimize-contrast;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        
        @media only screen and (-webkit-min-device-pixel-ratio: 2),
               only screen and (min--moz-device-pixel-ratio: 2),
               only screen and (-o-min-device-pixel-ratio: 2/1),
               only screen and (min-device-pixel-ratio: 2) {
            canvas {
                image-rendering: -webkit-optimize-contrast;
                -ms-interpolation-mode: bicubic;
            }
        }
    </style>
</head>
<body>
    <div class="fontPreload">.</div>
    <script src="assets/scripts/phaser.js"></script>
    <script src="assets/scripts/utils.js"></script>
    <script src="assets/scripts/Card.js"></script>
    <script src="assets/scripts/AboutScene.js"></script>
    <script src="assets/scripts/LevelCompleteScene.js"></script>
    <script src="assets/scripts/RecordsScene.js"></script>
    <script src="assets/scripts/GameScene.js"></script>
    <script src="assets/scripts/main.js"></script>
</body>
</html>
